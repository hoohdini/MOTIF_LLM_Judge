# 체크 레지스트리. 체크를 추가·수정할 때는 이 파일만 고친다.
# desc는 저지 프롬프트에 그대로 들어간다. desc나 프롬프트 파일이 바뀌면 해당 그룹은 자동으로 재판정 대상이 된다.
# severity: blocker = 단위 판정에 반영 / warn = 기록만
# values: 허용 판정값. 첫 값이 통과값.
# evidence_dependent: 근거 원문을 읽어야 하는 체크. 수식이 깨진 단위는 policy.math_evidence에 따라 보류된다.
# applies: 문항 형식 조건 (없으면 전부). TF:False 처럼 "형식:정답"도 가능.

groups:
  atom_audit:
    stage: card
    unit: atom
    prompt: prompts/atom_audit.v1.md
    checks:
      GROUNDED:
        severity: blocker
        values: [pass, revise, fail]
        evidence_dependent: true
        cite: evidence_id
        desc: "The cited evidence sentences state the atom. pass = fully stated. revise = the core claim is stated, and the gap is only wording, strength, or a dropped/extra peripheral qualifier that can be fixed by deleting or softening words (say what). fail = not stated, OR the atom adds substantive content the evidence lacks: a scope or population restriction (e.g. 'In B-ALL'), a mechanism or operation, a characterization (e.g. 'an unbounded while loop'), or a formula/definition. If deleting the unsupported part would change what the atom tests, it is fail, not revise. For pass, put the supporting evidence ids in cite (required)."
      SINGLE_CLAIM:
        severity: blocker
        values: [pass, revise]
        desc: "The atom is one independently assessable claim. revise = it joins two or more claims that could be true or false separately."
      SCOPE_LABEL:
        severity: blocker
        values: [pass, revise]
        desc: "The S label fits (S1 what it is / S2 how it works / S3 where it ends). revise = wrong label; put the right one in why, e.g. 'S2: ...'."
      L1_ONLY:
        severity: blocker
        values: [pass, revise, fail]
        desc: "The atom is recall-level knowledge: one fact a person who studied the concept would simply know. revise = the core fact is recall-level but the sentence carries extra load that must be removed, e.g. stacked conditions (since/although/if ... and ...), a procedural or evaluative add-on ('easy to define but requires checking ...'), or a clause that introduces a second technical concept that must be known separately (e.g. 'if X is an inner Kan complex' when that is not the card concept). fail = knowing it requires applying the concept to a new problem, or combining facts from distant passages."
      SOURCE_INDEPENDENT:
        severity: blocker
        values: [pass, revise, fail]
        desc: "A domain expert who never read this book could judge the claim true or false. revise = phrased as the authors' statement but the claim itself is general (drop the attribution). fail = the authors' opinion or choice, or the finding of one study, so the answer is not fixed without the source."
      NO_OVERLAP:
        severity: blocker
        values: [pass, fail]
        cite: unit_id
        desc: "No other atom in this card states or contains the same claim. If two atoms overlap, fail only the less informative one and put the other atom's id in cite; the other one passes."
      CENTRALITY:
        severity: warn
        values: [pass, fail]
        desc: "The atom matters for understanding the concept. fail = peripheral detail."
    batch_checks:
      CONCEPT_SCOPE:
        severity: warn
        values: [pass, fail]
        desc: "The concept is a general concept of the field. fail = a single system, product, or one study's topic."

  item_audit:
    stage: item
    unit: item
    prompt: prompts/item_audit.v2.md
    checks:
      G1_SINGLE_ATOM:
        severity: blocker
        values: [pass, fail]
        desc: "The correct answer follows from this atom alone, without other background knowledge. fail if answering also needs a fact the atom does not state (e.g. the atom says A affects B, but the question needs to know in which direction or in which situation)."
      G2_NO_COMPUTATION:
        severity: blocker
        values: [pass, fail]
        desc: "No calculation, proof, or combination of several facts is needed (no L2 application)."
      G3_FINAL_ANSWER:
        severity: blocker
        values: [pass, fail]
        desc: "The answer can be graded as a label, an option, or the presence of key points."
      KEY_CORRECT:
        severity: blocker
        values: [pass, fail]
        evidence_dependent: true
        desc: "The answer key agrees with the atom and evidence. For a False/No target, the atom must rule the statement out: the item must contradict the atom, not merely say something the atom does not mention. fail if the statement could still be true while the atom is true (e.g. the atom states one hypothesis and the item states a rival hypothesis the atom does not exclude)."
      SINGLE_ANSWER:
        severity: blocker
        values: [pass, fail]
        applies: [TF, YN, MCQ]
        desc: "Exactly one option or label is correct. For this check only, also use general domain knowledge: fail if another option or label could be correct in reality."
      NO_LEAK:
        severity: blocker
        values: [pass, fail]
        desc: "The item does not give away its answer. OPEN/MCQ/YN: the question does not state or closely paraphrase the answer. TF: the statement itself is what is tested, so a paraphrase of the atom is fine; fail only for hints outside the claim (e.g. 'as is well known')."
      KP_IN_ATOM:
        severity: blocker
        values: [pass, fail]
        applies: [OPEN]
        desc: "Every key point is part of the atom."
      YN_CASE_FORMAT:
        severity: blocker
        values: [pass, fail]
        applies: [YN]
        desc: "The case describes a concrete object (patient, system, dataset, mathematical object) and the question asks whether THE CASE is an instance of / exhibits the property. fail = it asks whether a claim, view, belief, or approach is correct, consistent, or possible."
      ONE_ELEMENT_CHANGE:
        severity: blocker
        values: [pass, fail]
        applies: ["TF:False", MCQ]
        desc: "An element is one slot of the claim: a quantity, a direction, a condition, an entity or role, or a negation. Count slots, not words: rewording several words to change one idea is one element; changing two independent slots (e.g. what is reported AND how the process ends) is two. TF False: the statement differs from the atom in exactly one element. MCQ: each distractor differs from the correct option in exactly one element, and the three distractors change different elements. Name the changed element(s) in why when failing."
      NO_SOURCE_REF:
        severity: blocker
        values: [pass, fail]
        desc: "The item does not point to a source: no book, authors, chapter, year, 'the review', 'this study', 'according to the text'. Named laws, scales, or standards are allowed."
      AUTHOR_OPINION_RESOLVED:
        severity: blocker
        values: [pass, fail]
        desc: "If the atom is the authors' opinion or one study's finding, the item must not ask it as a universal fact, and its answer must still be fixed without the book. pass if the atom is a general claim."
      NO_INTRA_CARD_OVERLAP:
        severity: blocker
        values: [pass, fail]
        cite: unit_id
        desc: "No other item in this batch tests the same knowledge (one answer implies the other). If two overlap, fail only the one listed later and put the other item's id in cite."

  answer_judge:
    stage: answer
    unit: answer
    prompt: prompts/answer_judge.v1.md
    checks:
      KEYPOINTS:
        severity: blocker
        values: [correct, partial, incorrect, hold]
        desc: "Per key point: present / absent / contradicted, with a verbatim quote from the answer."
      OOD:
        severity: warn          # 1안(자유 서술)에서는 blocker로 올려 사람 검토로 보낸다
        values: [pass, fail]
        desc: "fail = the answer makes claims about the concept that are not covered by the atom or key points; quote them in cite."
